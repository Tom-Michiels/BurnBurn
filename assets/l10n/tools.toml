nl = "Cirkel vanuit midden"
en = "Center circle"
tip_nl = "Cirkel vanuit middelpunt: klik het middelpunt, dan een punt op de omtrek."
tip_en = "Center circle: click the center, then a point on the circumference."

[tools."sketch.circle.two_point"]
panel = "create"
nl = "Cirkel: twee punten"
en = "Circle: two points"
tip_nl = "Klik twee punten die de middellijn van de cirkel bepalen."
tip_en = "Click two points that define the diameter of the circle."

[tools."sketch.circle.three_point"]
panel = "create"
nl = "Cirkel: drie punten"
en = "Circle: three points"
tip_nl = "Klik drie punten op de omtrek van de cirkel."
tip_en = "Click three points on the circumference."

[tools."sketch.circle.two_tangent"]
panel = "create"
nl = "Cirkel: twee raakelementen"
en = "Circle: two tangents"
tip_nl = "Klik twee elementen waar de cirkel aan raakt; geef daarna de straal op."
tip_en = "Click two elements the circle touches; then enter the radius."

[tools."sketch.circle.three_tangent"]
panel = "create"
nl = "Cirkel: drie raakelementen"
en = "Circle: three tangents"
tip_nl = "Klik drie elementen waar de cirkel aan raakt."
tip_en = "Click three elements the circle touches."

[tools."sketch.arc.three_point"]
