# Labels en tooltips per tool-id (zelfde ids als assets/icons/ui/icons.toml).
# nl/en: korte naam in de werkbalk en het menu. tip_nl/tip_en: wat de tool doet en hoe je klikt.
# Sneltoetsen horen in de commandocatalogus, niet in deze teksten.
# Een tool zonder passend icoon of zonder beschikbare functie krijgt disabled_reason_*.

[panels]
create      = { nl = "MAKEN",       en = "CREATE" }
modify      = { nl = "WIJZIGEN",    en = "MODIFY" }
pattern     = { nl = "PATROON",     en = "PATTERN" }
constraints = { nl = "BEPERKINGEN", en = "CONSTRAINTS" }
insert      = { nl = "INVOEGEN",    en = "INSERT" }
select      = { nl = "SELECTEREN",  en = "SELECT" }

# Maken
[tools."sketch.line"]
panel = "create"
nl = "Lijn"
en = "Line"
tip_nl = "Lijn: klik het beginpunt, dan het eindpunt. Esc annuleert."
tip_en = "Line: click the start point, then the end point. Esc cancels."

[tools."sketch.line.midpoint"]
panel = "create"
nl = "Lijn vanuit midden"
en = "Midpoint line"
tip_nl = "Lijn vanuit midden: klik het midden, dan een uiteinde. De lijn is symmetrisch om het midden."
tip_en = "Midpoint line: click the middle, then one end. The line is symmetric about the middle."

[tools."sketch.centerline"]
panel = "create"
nl = "Hulplijn"
en = "Centerline"
tip_nl = "Hulplijn: klik het beginpunt en het eindpunt. Hulplijnen tellen niet mee als profiel."
tip_en = "Centerline: click the start and end point. Centerlines do not count as profile."

[tools."sketch.rectangle.two_point"]
panel = "create"
nl = "Rechthoek: twee hoeken"
en = "Rectangle: two corners"
tip_nl = "Rechthoek met twee hoeken: klik de ene hoek, dan de tegenoverliggende."
tip_en = "Two-corner rectangle: click one corner, then the opposite corner."

[tools."sketch.rectangle.center"]
panel = "create"
nl = "Rechthoek vanuit midden"
en = "Center rectangle"
tip_nl = "Rechthoek vanuit middelpunt: klik het middelpunt, dan een hoek"
tip_en = "Center rectangle: click the center, then a corner"

[tools."sketch.rectangle.three_point"]
panel = "create"
nl = "Rechthoek: drie punten"
en = "Rectangle: three points"
tip_nl = "Klik twee punten voor de eerste zijde, dan een derde punt voor de breedte."
tip_en = "Click two points for the first side, then a third point for the width."

[tools."sketch.rectangle.rounded"]
panel = "create"
nl = "Afgeronde rechthoek"
en = "Rounded rectangle"
tip_nl = "Klik twee hoeken; de hoeken worden afgerond met de ingestelde straal."
tip_en = "Click two corners; the corners are rounded with the set radius."

[tools."sketch.circle.center"]
