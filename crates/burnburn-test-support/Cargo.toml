[package]
name = "burnburn-test-support"
description = "Test-only fakes (clock, scripted peer) and checked fixtures for BurnBurn integration tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
burnburn-document = { workspace = true, optional = true }
burnburn-geometry = { workspace = true, optional = true }
burnburn-image = { workspace = true, optional = true }
burnburn-io = { workspace = true, optional = true }
burnburn-job = { workspace = true, optional = true }
burnburn-machine = { workspace = true, optional = true }
burnburn-presentation = { workspace = true, optional = true }
burnburn-ruida = { workspace = true, optional = true }
burnburn-types = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[features]
# Fixtures for the presentation and host tests (the `host` module); pulls in presentation and the crates it uses.
host = [
  "dep:burnburn-document", "dep:burnburn-geometry", "dep:burnburn-image", "dep:burnburn-io", "dep:burnburn-job",
  "dep:burnburn-machine", "dep:burnburn-presentation", "dep:burnburn-ruida",
]

[lints]
workspace = true

# Only for tests/untrusted_bytes.rs (stable counterpart of fuzz/). Dev-only, so no cycle with the
# crates that use this one as a dev-dependency.
[dev-dependencies]
burnburn-io = { workspace = true }
burnburn-ruida = { workspace = true }
proptest = { workspace = true }
