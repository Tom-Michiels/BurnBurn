[package]
name = "burnburn-windows"
description = "BurnBurn's native Windows host (IM08 proof): Win32 window, object list, dimension field, file dialogs and the shared DX12 canvas"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Same lint set as the workspace except unsafe_code: denied, not forbidden, so that the Win32 layer
# (src/win32/, cfg(windows)) can allow it locally with SAFETY comments (ADR 0002/0006). Keep the
# rest in sync with [workspace.lints].
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
too_many_arguments = "allow"
type_complexity = "allow"
neg_cmp_op_on_partial_ord = "allow"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[[bin]]
name = "burnburn-win"
path = "src/main.rs"

[dependencies]
# Platform-independent message adapter (Win32 message data -> UiIntent): tested on every host OS.
burnburn-document = { workspace = true }
burnburn-editor = { workspace = true }
burnburn-geometry = { workspace = true }
burnburn-host-models = { workspace = true }
burnburn-image = { workspace = true }
burnburn-io = { workspace = true }
burnburn-presentation = { workspace = true }
# System font source for canvas text input (`fonts::first_readable_font`).
burnburn-runtime = { workspace = true }
burnburn-types = { workspace = true }
# The stored recent lists use the macOS host's reader/writer (burnburn-macos/src/recent.rs).
serde_json = { workspace = true }
# assets/l10n/tools.toml (tool labels) for the shared tool-strip texts.
toml = { workspace = true }

[dev-dependencies]
# Machine profiles with blocked features for the Cut Settings tests; the laser/camera/file panel
# tests (W4-L8b) drive a real controller over fake ports (no laser, no camera).
burnburn-job = { workspace = true }
burnburn-machine = { workspace = true }
burnburn-ruida = { workspace = true }
# Text panels: a font source with several faces and the OFL test fonts.
burnburn-test-support = { workspace = true }
burnburn-text = { workspace = true }

[target.'cfg(windows)'.dependencies]
burnburn-render = { workspace = true }
raw-window-handle = { workspace = true }
wgpu = { workspace = true, features = ["dx12"] }
windows = { workspace = true, features = [
    "std",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
