[package]
name = "burnburn-scenarios"
description = "Cross-crate scenario tests (integration gates) for BurnBurn; test-only, no library code"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Test-only crate (owner Testing): everything lives in tests/ and uses the domain crates as
