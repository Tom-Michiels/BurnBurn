[dependencies]
# Platform-independent adapter (event -> UiIntent) and the app wiring: tested headlessly everywhere.
burnburn-document = { workspace = true }
burnburn-editor = { workspace = true }
burnburn-geometry = { workspace = true }
burnburn-host-models = { workspace = true }
# IM27: camera frames become `SourceImage`s (layers.toml allows image for the hosts).
burnburn-image = { workspace = true }
# StdFileSystem for AppPorts.fs until burnburn-runtime re-exports it (docs/coordination/gui.md).
burnburn-io = { workspace = true }
# Toolbar icons (RGBA from the SVG masters, light and dark).
burnburn-icons = { workspace = true }
burnburn-presentation = { workspace = true }
# System font source for canvas text input (`fonts::first_readable_font`).
burnburn-runtime = { workspace = true }
burnburn-types = { workspace = true }

[dev-dependencies]
# Compiling a plan in the preview-panel test needs a machine profile and a controller dialect.
burnburn-job = { workspace = true }
burnburn-ruida = { workspace = true }
# Machine panel test: execution states and machine ids as the view model carries them.
burnburn-machine = { workspace = true }
# Text panels: a font source with several faces and the OFL test fonts (W3-UI-tekst).
burnburn-test-support = { workspace = true, features = ["host"] }
burnburn-text = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
burnburn-render = { workspace = true }
wgpu = { workspace = true, features = ["metal"] }
# The canvas NSView handed to wgpu's Metal surface (wgpu attaches and tracks its CAMetalLayer).
raw-window-handle = { workspace = true }
# `exception`: AppKit methods that raise an NSException become a Rust error (ADR 0002).
objc2 = { workspace = true, features = ["exception"] }
# Completion handlers of NSSavePanel/NSOpenPanel/NSAlert sheets (ADR 0002).
block2 = { workspace = true }
# Wake-up of the main thread when a worker task finishes (ADR 0002).
dispatch2 = { workspace = true }
objc2-av-foundation = { workspace = true, optional = true, features = ["std", "block2", "dispatch2", "objc2-core-media", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureSession", "AVCaptureSessionPreset", "AVCaptureVideoDataOutput", "AVMediaFormat"] }
objc2-core-media = { workspace = true, optional = true, features = ["std", "objc2-core-video", "CMBase", "CMFormatDescription", "CMSampleBuffer"] }
objc2-core-video = { workspace = true, optional = true, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-foundation = { workspace = true, features = ["std", "block2", "NSDictionary", "NSError", "NSArray", "NSAttributedString", "NSDate", "NSLocale", "NSRange", "NSValue", "NSGeometry", "NSIndexSet", "NSNotification", "NSObjCRuntime", "NSObject", "NSRunLoop", "NSString", "NSTimeZone", "NSTimer", "NSURL", "NSData"] }
objc2-app-kit = { workspace = true, features = ["std", "block2", "objc2-core-foundation", "NSAccessibility", "NSAccessibilityConstants", "NSAccessibilityElement", "NSAccessibilityProtocols", "NSActionCell", "NSAlert", "NSApplication", "NSImageRep", "NSImage", "NSImageView", "NSImageCell", "NSBox", "NSBitmapImageRep", "NSAppearance", "NSAttributedString", "NSButton", "NSButtonCell", "NSCell", "NSColor", "NSColorSpace", "NSControl", "NSEvent", "NSFont", "NSGraphics", "NSGraphicsContext", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel", "NSParagraphStyle", "NSPopUpButton", "NSResponder", "NSRunningApplication", "NSSavePanel", "NSScrollView", "NSSegmentedControl", "NSSplitView", "NSTableColumn", "NSTableView", "NSText", "NSTextField", "NSTextFieldCell", "NSTextInputClient", "NSTextInputContext", "NSTextView", "NSToolbar", "NSToolbarItem", "NSTrackingArea", "NSUserInterfaceItemIdentification", "NSView", "NSWindow", "NSPasteboard", "NSSlider", "NSSliderCell", "NSWorkspace"] }

[[test]]
name = "quiet_windows"
path = "../../tests/native/macos/quiet_windows.rs"
harness = false

# Opt-in look-and-feel review tool (LF0): renders windows offscreen to PNG only when
