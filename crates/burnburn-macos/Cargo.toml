[package]
name = "burnburn-macos"
description = "BurnBurn's native macOS host: AppKit window, menu, inspector and the Metal canvas surface"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "burnburn"

# The workspace lints, except unsafe_code: denied, not forbidden, so that the AppKit layer
# (src/appkit/) can allow it locally with SAFETY comments: defining Objective-C classes and creating
# the wgpu surface on an NSView have no safe API. Keep the rest in sync with [workspace.lints].
# ADR 0002 adds: unsafe_op_in_unsafe_fn, undocumented_unsafe_blocks, multiple_unsafe_ops_per_block.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
too_many_arguments = "allow"
type_complexity = "allow"
neg_cmp_op_on_partial_ord = "allow"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[features]
default = ["camera"]
# IM27: the AVFoundation camera adapter (`appkit::camera`). On by default since the integration
# round: `run_app` attaches it to the camera section, which only reads the permission state and
# the device list; the privacy prompt and capture start only on the user's click, never in
# automatic tests (see docs/dev-notes/IM27.md, IM20.md).
camera = ["dep:objc2-av-foundation", "dep:objc2-core-media", "dep:objc2-core-video"]

[[bin]]
name = "burnburn"
path = "src/main.rs"

# AppKit lifecycle on the main thread with the real event loop: libtest's harness would run the
# test on a worker thread, so each test brings its own main (one scenario per process, ADR 0002).
